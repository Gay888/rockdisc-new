     <!-- เพิ่มใน about.html ก่อน </body> -->
<div class="overlay" id="overlay">
    <div class="modal">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div class="modal-head">
            <div class="label">ROCKDISC</div>
        </div>
        <div class="tabs">
            <div class="tab" id="tabLogin" onclick="switchTab('login')">LOGIN</div>
            <div class="tab" id="tabSignup" onclick="switchTab('signup')">SIGN UP</div>
        </div>

        <div class="form-pane" id="paneLogin">
            <form onsubmit="return handleLogin(event)">
                <div class="field">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required placeholder="you@example.com">
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button class="submit-btn" type="submit">เข้าสู่ระบบ</button>
            </form>
            <div class="switch-line">ยังไม่มีบัญชี? <a onclick="switchTab('signup')">สมัครสมาชิก</a></div>
        </div>

        <div class="form-pane" id="paneSignup">
            <form onsubmit="return handleSignup(event)">
                <div class="field">
                    <label>ชื่อผู้ใช้</label>
                    <input type="text" id="signupName" required placeholder="Your name">
                </div>
                <div class="field">
                    <label>Email</label>
                    <input type="email" id="signupEmail" required placeholder="you@example.com">
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="signupPassword" required minlength="6" placeholder="อย่างน้อย 6 ตัวอักษร">
                </div>
                <div class="error-msg" id="signupError">กรุณากรอกข้อมูลให้ครบและรหัสผ่านอย่างน้อย 6 ตัวอักษร</div>
                <button class="submit-btn" type="submit">สมัครสมาชิก</button>
            </form>
            <div class="switch-line">มีบัญชีอยู่แล้ว? <a onclick="switchTab('login')">เข้าสู่ระบบ</a></div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>
